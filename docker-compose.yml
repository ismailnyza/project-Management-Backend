services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pmdb
      POSTGRES_USER: pmuser
      POSTGRES_PASSWORD: pmpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/pmdb
      DATABASE_USER: pmuser
      DATABASE_PASS: pmpass
      JWT_SECRET: change-this-to-a-32-char-secret!!
    depends_on:
      - db

volumes:
  pgdata:
