spring:
  application:
    name: project-management-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pmdb}
    username: ${DATABASE_USER:pmuser}
    password: ${DATABASE_PASS:pmpass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${APP_PORT:8080}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:a-32-char-secret-key-for-devs!}
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:pmdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
jwt:
  secret: ${JWT_SECRET:a-32-char-secret-key-for-devs!}
  expiration-ms: 86400000
